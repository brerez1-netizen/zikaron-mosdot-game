<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מי יושב שם · מסך המרצה</title>
<style>
  :root{
    --bg:#141d24; --panel:#1c2831; --panel2:#24333e; --line:#33444f;
    --txt:#eef3f0; --dim:#8fa3a0; --accent:#b6e34a; --green:#4ade80; --bad:#e5675d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",Arial,sans-serif;
       height:100vh;overflow:hidden;display:flex;flex-direction:column}

  /* ---------- סרגל עליון ---------- */
  header{display:flex;align-items:center;gap:16px;padding:10px 22px;background:var(--panel);
         border-bottom:1px solid var(--line);flex:none}
  header h1{font-size:22px;color:var(--accent);font-weight:700}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:16px;
        padding:4px 13px;font-size:15px;color:var(--dim)}
  .sp{flex:1}
  .turn{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700}
  .dot{width:19px;height:19px;border-radius:50%}
  .clock{font-size:30px;font-weight:700;min-width:52px;text-align:center;
         font-variant-numeric:tabular-nums}
  .clock.low{color:var(--bad)}

  main{flex:1;display:flex;gap:18px;padding:18px 22px;min-height:0}

  /* ---------- הלוח ---------- */
  .board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
         gap:12px;min-height:0}
  .card{position:relative;border-radius:14px;border:2px solid var(--line);background:var(--panel);
        display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;
        font-size:17px;line-height:1.35;font-weight:600;overflow:hidden;
        transition:transform .18s ease,border-color .18s ease,background .18s ease}
  .card .num{position:absolute;top:7px;inset-inline-start:10px;font-size:15px;color:var(--dim);
             font-weight:700}
  .card.down{background:linear-gradient(150deg,#1d2b34,#16212a);cursor:default}
  .card.down .num{font-size:34px;color:#3d5560;position:static}
  .card.up{border-color:var(--accent);background:var(--panel2);transform:scale(1.03)}
  .card.miss{border-color:var(--bad)}
  .card.taken{opacity:.42;border-style:dashed}
  .card.taken .own{position:absolute;bottom:6px;inset-inline-end:9px;font-size:13px;font-weight:700}

  /* ---------- לוח הניקוד ---------- */
  .side{width:270px;flex:none;display:flex;flex-direction:column;gap:10px;min-height:0}
  .side h2{font-size:16px;color:var(--dim);font-weight:600}
  .roster{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .p{display:flex;align-items:center;gap:9px;background:var(--panel);border-radius:9px;
     padding:8px 11px;font-size:16px;border:2px solid transparent}
  .p.now{border-color:var(--accent)}
  .p .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p .sc{font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- לובי ---------- */
  .lobby{flex:1;display:flex;gap:30px;align-items:center;justify-content:center;padding:0 40px}
  .lobby .art{width:38%;max-width:430px;border-radius:18px;overflow:hidden}
  .lobby .art img{width:100%;display:block}
  .lobby .col{max-width:520px}
  .lobby h1{font-size:44px;color:var(--accent);margin-bottom:6px}
  .lobby .sub{font-size:19px;color:var(--dim);margin-bottom:18px}
  .lobby .rules{background:var(--panel);border-radius:12px;padding:14px 18px;font-size:16px;
                line-height:1.8;color:#cfdad6;margin-bottom:16px}
  #qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
  .joinurl{font-size:15px;color:var(--dim);margin-top:8px;direction:ltr;text-align:start}

  /* ---------- חלונית ההתאמה ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,16,20,.93);display:flex;align-items:center;
           justify-content:center;padding:40px;z-index:50}
  .rev{display:flex;gap:28px;max-width:1150px;align-items:center}
  .rev .pic{width:42%;flex:none;border-radius:16px;overflow:hidden;background:var(--panel2)}
  .rev .pic img{width:100%;display:block}
  .rev .who{font-size:19px;font-weight:700;margin-bottom:12px}
  .rev .pairline{font-size:27px;font-weight:700;line-height:1.35}
  .rev .plus{color:var(--accent);font-size:26px;font-weight:700;margin:2px 0}
  .rev .info{font-size:20px;line-height:1.65;color:#cfdad6;margin-top:14px}

  /* ---------- סיום ---------- */
  .end{flex:1;overflow:auto;padding:20px 60px}
  .end h1{font-size:38px;color:var(--accent);margin-bottom:16px}
  .podium{display:flex;gap:16px;margin-bottom:22px}
  .podium .s{flex:1;background:var(--panel);border-radius:14px;padding:16px;text-align:center}
  .podium .s .r{font-size:15px;color:var(--dim)}
  .podium .s .n{font-size:26px;font-weight:700;margin:6px 0}
  .podium .s .v{font-size:20px;color:var(--accent);font-weight:700}
  .titles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .titles .t{background:var(--panel);border-radius:11px;padding:11px 15px;font-size:17px;
             display:flex;gap:10px;align-items:center}
  .titles .t b{color:var(--accent)}

  button{font-family:inherit;font-size:17px;font-weight:700;padding:12px 22px;border:none;
         border-radius:11px;background:var(--accent);color:#1b2408;cursor:pointer}
  button.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.4;cursor:default}
  .bar{display:flex;gap:10px;align-items:center;padding:10px 22px;background:var(--panel);
       border-top:1px solid var(--line);flex:none}
  .hidden{display:none!important}
</style>
</head>
<body>

<header id="hdr" class="hidden">
  <h1 id="hBoard"></h1>
  <span class="chip" id="hLeft"></span>
  <span class="sp"></span>
  <span class="turn"><span class="dot" id="tDot"></span><span id="tName"></span></span>
  <span class="clock" id="clock"></span>
</header>

<!-- ===================== לובי ===================== -->
<div class="lobby" id="lobby">
  <div class="art"><img id="cover" alt=""></div>
  <div class="col">
    <h1 id="lTitle"></h1>
    <div class="sub" id="lSub"></div>
    <div class="rules">
      הלוח הפוך. בכל תור סטודנט אחד בוחר שני קלפים מהטלפון.<br>
      התאימו? הזוג נצבע בצבע שלו ויוצא מהלוח, ועולה ההסבר.<br>
      לא התאימו? הקלפים מתהפכים חזרה. התור עובר הלאה בכל מקרה.
    </div>
    <div id="qr"></div>
    <div class="joinurl" id="joinurl"></div>
  </div>
</div>

<!-- ===================== משחק ===================== -->
<main id="play" class="hidden">
  <div class="board" id="board"></div>
  <div class="side">
    <h2>הכיתה</h2>
    <div class="roster" id="roster"></div>
  </div>
</main>

<!-- ===================== סיום ===================== -->
<div class="end hidden" id="end"></div>

<div class="bar">
  <button id="btnStart">התחלה</button>
  <button id="btnNext" class="ghost hidden">הלוח הבא</button>
  <button id="btnSkip" class="ghost">דילוג תור</button>
  <span class="sp"></span>
  <span class="chip" id="stateChip">לובי</span>
  <button id="btnReset" class="ghost danger">איפוס עמוק</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="js/gameData.js"></script>
<script>
/* =====================================================================
   מסך המרצה. הוא היחיד שמחזיק את התוכן: איזה קלף שייך לאיזה זוג נשמר
   כאן ובאחסון המקומי, ולא נכתב ל-Firebase. הטלפון מקבל רק מספרי קלפים,
   מי תפס אותם ומה כתוב על הקלפים שהפוכים כרגע, ולכן אי אפשר לפתוח שם
   קונסולה ולקרוא את הפתרון.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBTGsY27ie1FHAmBmtYVAjP3u5TyHMh-UA",
  databaseURL: "https://erez-zikaron-mosdot-game-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "erez-zikaron-mosdot-game",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const G = window.gameData;
const SLUG = "zikaronMosdot";
const LAYOUT_LS = SLUG + ".layout";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const zugot = (n) => (n === 1 ? "זוג אחד" : n + " זוגות");

let players = {};
let cur = { state: "lobby" };
let layout = null;      // [{pair, side}] לפי מיקום על הלוח, מקומי בלבד
let tick = null;
let busy = false;       // חוסם קליטת בחירות בזמן אנימציית התאמה או החטאה

/* ---------------------- כתובת ההצטרפות ---------------------- */
const joinUrl = location.href.replace(/index\.html.*$/, "").replace(/\/?$/, "/") + "play.html";
$("joinurl").textContent = joinUrl;
(function drawQr() {
  const cv = document.createElement("canvas");
  $("qr").appendChild(cv);
  new QRious({ element: cv, value: joinUrl, size: 260, level: "M" });
})();

$("lTitle").textContent = G.title;
$("lSub").textContent = G.subtitle;
$("cover").src = G.cover;

/* ---------------------- מעקב אחרי ה-DB ---------------------- */
db.ref("players").on("value", (s) => { players = s.val() || {}; render(); });
db.ref("game").on("value", (s) => { cur = s.val() || { state: "lobby" }; restoreLayout(); render(); });
db.ref("game/pick").on("value", (s) => { const p = s.val(); if (p) handlePick(p); });

/** סדר התורות נקבע לפי סדר ההצטרפות ונשאר יציב. */
function order() {
  return Object.entries(players)
    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0))
    .map(([pid]) => pid);
}
function turnPid() {
  const o = order();
  return o.length ? o[(cur.turnIdx || 0) % o.length] : null;
}

/* ---------------------- בניית לוח ---------------------- */
function buildBoard(bi) {
  const pairs = G.boards[bi].pairs;
  const slots = [];
  pairs.forEach((_, p) => { slots.push({ pair: p, side: 0 }); slots.push({ pair: p, side: 1 }); });
  for (let i = slots.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [slots[i], slots[j]] = [slots[j], slots[i]];
  }
  layout = slots;
  localStorage.setItem(LAYOUT_LS, JSON.stringify({ board: bi, slots }));
  // מחרוזת ריקה ולא null: Firebase מוחק מפתחות עם null, ואז כל מערך הקלפים נעלם
  return slots.map(() => ({ t: "" }));
}
/** רענון של מסך המרצה באמצע לוח לא אמור לאבד את הפריסה. */
function restoreLayout() {
  if (layout || cur.state !== "playing") return;
  try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_LS) || "null");
    if (saved && saved.board === cur.board) layout = saved.slots;
  } catch (e) { /* פריסה שבורה, הלוח ייבנה מחדש בהתחלה הבאה */ }
}

function startBoard(bi) {
  const cards = buildBoard(bi);
  db.ref("game").set({
    state: "playing", board: bi, cards, flip: [], turnIdx: cur.turnIdx || 0,
    turnEndsAt: Date.now() + G.turnSeconds * 1000, reveal: null, pick: null,
  });
}

$("btnStart").onclick = () => {
  if (!Object.keys(players).length) { alert("אף אחד עוד לא הצטרף."); return; }
  db.ref("players").once("value").then((s) => {
    const upd = {};
    Object.keys(s.val() || {}).forEach((pid) => { upd[pid + "/score"] = 0; upd[pid + "/tries"] = 0; upd[pid + "/streak"] = 0; upd[pid + "/best"] = 0; });
    return db.ref("players").update(upd);
  }).then(() => startBoard(0));
};
$("btnNext").onclick = () => {
  const nb = (cur.board || 0) + 1;
  if (nb >= G.boards.length) { db.ref("game").update({ state: "finished" }); return; }
  startBoard(nb);
};
$("btnSkip").onclick = () => { if (cur.state === "playing") nextTurn(); };
$("btnReset").onclick = () => {
  if (!confirm("איפוס עמוק ימחק את כל שחקני הכיתה הנוכחית ואת כל הניקוד. להמשיך?")) return;
  localStorage.removeItem(LAYOUT_LS);
  layout = null;
  db.ref("players").remove();
  db.ref("game").set({ state: "lobby" });
};

/* ---------------------- קליטת בחירה מהטלפון ---------------------- */
function handlePick(pick) {
  db.ref("game/pick").remove();
  if (busy || cur.state !== "playing") return;
  if (pick.pid !== turnPid()) return;
  const i = pick.i;
  const cards = cur.cards || [];
  const flip = cur.flip || [];
  if (!cards[i] || cards[i].t || flip.includes(i) || flip.length >= 2) return;

  const nf = flip.concat(i);
  if (nf.length < 2) { db.ref("game/flip").set(nf); return; }

  busy = true;
  const [x, y] = nf;
  const same = layout && layout[x].pair === layout[y].pair;
  db.ref("game/flip").set(nf);
  db.ref(`players/${pick.pid}/tries`).transaction((v) => (v || 0) + 1);

  if (same) {
    const pid = pick.pid;
    setTimeout(() => {
      const upd = {};
      upd[`cards/${x}/t`] = pid;
      upd[`cards/${y}/t`] = pid;
      upd.flip = [];
      upd.reveal = { pair: layout[x].pair, by: pid };
      db.ref("game").update(upd);
      db.ref(`players/${pid}`).transaction((p) => {
        if (!p) return p;
        p.score = (p.score || 0) + 1;
        p.streak = (p.streak || 0) + 1;
        p.best = Math.max(p.best || 0, p.streak);
        return p;
      });
      busy = false;
    }, 900);
  } else {
    db.ref(`players/${pick.pid}/streak`).set(0);
    setTimeout(() => { db.ref("game/flip").set([]); busy = false; nextTurn(); }, 1800);
  }
}

/** התור עובר תמיד, גם אחרי התאמה, כדי שכיתה שלמה תשחק ולא שחקן אחד. */
function nextTurn() {
  const o = order();
  if (!o.length) return;
  db.ref("game").update({
    turnIdx: ((cur.turnIdx || 0) + 1) % o.length,
    turnEndsAt: Date.now() + G.turnSeconds * 1000,
  });
}

/* ---------------------- חלונית ההתאמה ---------------------- */
let revTimer = null;
function showReveal(rev) {
  const pair = G.boards[cur.board].pairs[rev.pair];
  const p = players[rev.by] || { name: "", color: "#888" };
  const div = document.createElement("div");
  div.className = "overlay";
  div.id = "ov";
  div.innerHTML = `<div class="rev">
      <div class="pic"><img src="${esc(pair.img)}" alt=""></div>
      <div>
        <div class="who" style="color:${esc(p.color)}">הזוג של ${esc(p.name)}</div>
        <div class="pairline">${esc(pair.a)}</div>
        <div class="plus">+</div>
        <div class="pairline">${esc(pair.b)}</div>
        <div class="info">${esc(pair.info)}</div>
      </div>
    </div>`;
  div.onclick = closeReveal;
  document.body.appendChild(div);
  clearTimeout(revTimer);
  revTimer = setTimeout(closeReveal, 7000);
}
function closeReveal() {
  clearTimeout(revTimer);
  const ov = $("ov");
  if (!ov) return;
  ov.remove();
  db.ref("game/reveal").remove();
  const left = (cur.cards || []).filter((c) => !c.t).length;
  if (left === 0) db.ref("game").update({ state: "boardDone" });
  else nextTurn();
}

/* ---------------------- ציור ---------------------- */
function render() {
  const st = cur.state || "lobby";
  $("stateChip").textContent = { lobby: "לובי", playing: "משחק", boardDone: "סוף לוח", finished: "סיום" }[st] || st;
  $("lobby").classList.toggle("hidden", st !== "lobby");
  $("play").classList.toggle("hidden", st !== "playing" && st !== "boardDone");
  $("end").classList.toggle("hidden", st !== "finished");
  $("hdr").classList.toggle("hidden", st === "lobby" || st === "finished");
  $("btnStart").classList.toggle("hidden", st !== "lobby");
  $("btnNext").classList.toggle("hidden", st !== "boardDone");
  $("btnSkip").disabled = st !== "playing";

  if (st === "lobby") { renderRoster(); stopClock(); return; }
  if (st === "finished") { renderEnd(); stopClock(); return; }

  const b = G.boards[cur.board || 0];
  $("hBoard").textContent = `לוח ${(cur.board || 0) + 1} מתוך ${G.boards.length}: ${b.name}`;
  const left = (cur.cards || []).filter((c) => !c.t).length / 2;
  $("hLeft").textContent = left ? (left === 1 ? "נותר זוג אחד" : `נותרו ${left} זוגות`) : "הלוח נגמר";

  const tp = turnPid();
  const tPlayer = players[tp];
  $("tDot").style.background = tPlayer ? tPlayer.color : "transparent";
  $("tName").textContent = st === "boardDone" ? "" : (tPlayer ? tPlayer.name : "");

  renderBoard();
  renderRoster();

  if (cur.reveal && !$("ov")) showReveal(cur.reveal);
  if (st === "playing" && !cur.reveal) startClock(); else stopClock();
}

function renderBoard() {
  const cards = cur.cards || [];
  const flip = cur.flip || [];
  const miss = flip.length === 2 && layout && layout[flip[0]].pair !== layout[flip[1]].pair;
  const el = $("board");
  el.innerHTML = cards.map((c, i) => {
    if (c.t) {
      const p = players[c.t];
      const txt = layout ? sideText(i) : "";
      return `<div class="card taken" style="border-color:${esc(p ? p.color : "#555")}">
                <span>${esc(txt)}</span>
                <span class="own" style="color:${esc(p ? p.color : "#888")}">${esc(p ? p.name : "")}</span>
              </div>`;
    }
    if (flip.includes(i)) {
      return `<div class="card up ${miss ? "miss" : ""}">
                <span class="num">${i + 1}</span><span>${esc(sideText(i))}</span>
              </div>`;
    }
    return `<div class="card down"><span class="num">${i + 1}</span></div>`;
  }).join("");
}
function sideText(i) {
  if (!layout) return "";
  const s = layout[i];
  const pair = G.boards[cur.board].pairs[s.pair];
  return s.side === 0 ? pair.a : pair.b;
}

function renderRoster() {
  const tp = turnPid();
  const list = Object.entries(players).sort((a, b) => (b[1].score || 0) - (a[1].score || 0) || (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
  $("roster").innerHTML = list.length
    ? list.map(([pid, p]) => `<div class="p ${pid === tp ? "now" : ""}">
        <span class="dot" style="background:${esc(p.color)}"></span>
        <span class="nm">${esc(p.name)}</span>
        <span class="sc">${p.score || 0}</span></div>`).join("")
    : `<div class="p"><span class="nm" style="color:var(--dim)">מחכים למצטרפים</span></div>`;
}

/* ---------------------- שעון התור ---------------------- */
function startClock() {
  stopClock();
  tick = setInterval(() => {
    const left = Math.max(0, Math.ceil(((cur.turnEndsAt || 0) - Date.now()) / 1000));
    $("clock").textContent = left;
    $("clock").classList.toggle("low", left <= 5);
    if (left <= 0 && !busy && (cur.flip || []).length === 0) { stopClock(); nextTurn(); }
  }, 250);
}
function stopClock() { if (tick) { clearInterval(tick); tick = null; } $("clock").textContent = ""; }

/* ---------------------- מסך הסיום ---------------------- */
function renderEnd() {
  const list = Object.entries(players).map(([pid, p]) => ({ pid, ...p }))
    .sort((a, b) => (b.score || 0) - (a.score || 0));
  const podium = list.slice(0, 3).map((p, i) => `<div class="s">
      <div class="r">${["מקום ראשון", "מקום שני", "מקום שלישי"][i]}</div>
      <div class="n" style="color:${esc(p.color)}">${esc(p.name)}</div>
      <div class="v">${zugot(p.score || 0)}</div></div>`).join("");

  /* הקצאה חמדנית: כל תואר לשחקן אחר, כדי שכמעט כל הכיתה תצא עם משהו. */
  const used = new Set(list.slice(0, 3).map((p) => p.pid));
  const acc = (p) => (p.tries ? (p.score || 0) / p.tries : 0);
  const defs = [
    ["הרצף הארוך", (p) => p.best || 0, (p) => `${p.best || 0} התאמות ברצף`],
    ["הדייקן", acc, (p) => `${Math.round(acc(p) * 100)} אחוז מהתורות`],
    ["הכי הרבה ניסיונות", (p) => p.tries || 0, (p) => `${p.tries || 0} תורות`],
  ];
  const titles = [];
  defs.forEach(([name, score, label]) => {
    const c = list.filter((p) => !used.has(p.pid) && score(p) > 0).sort((a, b) => score(b) - score(a))[0];
    if (c) { used.add(c.pid); titles.push(`<div class="t"><b>${esc(name)}</b><span style="color:${esc(c.color)}">${esc(c.name)}</span><span style="color:var(--dim)">${esc(label(c))}</span></div>`); }
  });

  $("end").innerHTML = `<h1>סיימנו</h1>
    <div class="podium">${podium || "<div class='s'><div class='n'>אין שחקנים</div></div>"}</div>
    ${titles.length ? `<div class="titles">${titles.join("")}</div>` : ""}`;
}

render();
</script>
</body>
</html>
